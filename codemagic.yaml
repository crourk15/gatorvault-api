workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Rename to match your Codemagic App Store Connect integration (Team settings → Integrations).
    integrations:
      app_store_connect: codemagic
    environment:
      # No ios_signing block — Codemagic requires either distribution_type+bundle_identifier
      # OR provisioning_profiles. Signing is handled via fetch-signing-files in scripts.
      vars:
        XCODE_SCHEME: App
        BUNDLE_ID: com.gatorvaultinsider.app
        DEVELOPMENT_TEAM: "45C4DZJ4UJ"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies and build web bundle
        script: |
          cd client
          npm ci
          npm run build
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Fetch signing files and configure code signing
        script: |
          set -e
          keychain initialize
          FETCH_ARGS=(--type IOS_APP_STORE --create --verbose)
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            CERT_KEY_PATH="$CM_BUILD_DIR/cert_key.pem"
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
            FETCH_ARGS+=(--certificate-key=@file:"$CERT_KEY_PATH")
          else
            echo "WARN: CERTIFICATE_PRIVATE_KEY not set — --create may fail if no App Store profile exists yet."
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" "${FETCH_ARGS[@]}"
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/client/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
