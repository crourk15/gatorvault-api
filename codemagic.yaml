workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      # Certificate + profile must exist in Codemagic → Code signing identities.
      # Create App Store profile at developer.apple.com, then Fetch profiles in Codemagic.
      ios_signing:
        certificates:
          - certificate: gatorvault_appstore
        provisioning_profiles:
          - profile: gatorvault_appstore_profile
      vars:
        XCODE_SCHEME: App
        BUNDLE_ID: com.gatorvaultinsider.app
        DEVELOPMENT_TEAM: "45C4DZJ4UJ"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies and build web bundle
        script: |
          cd client
          npm ci
          npm run build
          export CAPACITOR_SERVER_URL=https://gatorvaultinsider.com/join/?mode=signin&next=/vault/
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/client/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
