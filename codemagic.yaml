workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        certificates:
          - certificate: gatorvault_appstore
        provisioning_profiles:
          - profile: gatorvault_appstore_profile
      vars:
        XCODE_SCHEME: App
        BUNDLE_ID: com.gatorvaultinsider.app
        DEVELOPMENT_TEAM: "45C4DZJ4UJ"
        NEXT_TELEMETRY_DISABLED: "1"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: |
          set -euo pipefail
          unset CAPACITOR_SERVER_URL || true
          cd client
          echo "Node $(node -v) | npm $(npm -v) | cwd $(pwd)"
          npm ci --legacy-peer-deps
          node scripts/patch-capgo-podspec.js
      - name: Build Next.js static export
        script: |
          set -euo pipefail
          cd client
          node scripts/verify-recruiting-cycle-exports.js
          npm run build
          test -f out/index.html
          test -d out/vault
          test -d out/join
          echo "OK: static export in client/out ($(find out -name '*.html' | wc -l | tr -d ' ') html files)"
      - name: Capacitor sync (bundle web assets into iOS)
        script: |
          set -euo pipefail
          unset CAPACITOR_SERVER_URL || true
          cd client
          npx cap sync ios
          test -d ios/App/App/public
          echo "OK: copied web bundle to ios/App/App/public"
      - name: Verify bundled Capacitor config (App Store 4.2.2)
        script: |
          set -euo pipefail
          CFG="client/ios/App/App/capacitor.config.json"
          test -f "$CFG"
          if grep -q '"server"' "$CFG"; then
            echo "ERROR: capacitor.config.json must NOT use live server.url for App Review" >&2
            cat "$CFG"
            exit 1
          fi
          echo "OK: bundled Capacitor shell (no live WebView URL)"
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/client/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
