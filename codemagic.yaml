workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      # Codemagic schema requires provisioning_profiles OR distribution_type+bundle_id.
      # Keep named cert+profile for validation/install; the refresh script then deletes
      # stale local profiles and forces a Push-enabled App Store profile before archive.
      ios_signing:
        certificates:
          - certificate: gatorvault_appstore
        provisioning_profiles:
          - profile: gatorvault_appstore_profile
      vars:
        XCODE_SCHEME: App
        BUNDLE_ID: com.gatorvaultinsider.app
        # App Store Connect numeric Apple ID (for build-number queries)
        APPLE_APP_APPLE_ID: "6783848215"
        DEVELOPMENT_TEAM: "45C4DZJ4UJ"
        NEXT_TELEMETRY_DISABLED: "1"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: |
          set -euo pipefail
          unset CAPACITOR_SERVER_URL || true
          cd client
          echo "Node $(node -v) | npm $(npm -v) | cwd $(pwd)"
          npm ci --legacy-peer-deps
          node scripts/patch-capgo-podspec.js
      - name: Build Next.js static export
        script: |
          set -euo pipefail
          cd client
          node scripts/verify-recruiting-cycle-exports.js
          npm run build
          test -f out/index.html
          test -d out/vault
          test -d out/join
          echo "OK: static export in client/out ($(find out -name '*.html' | wc -l | tr -d ' ') html files)"
      - name: Capacitor sync (bundle web assets into iOS)
        script: |
          set -euo pipefail
          unset CAPACITOR_SERVER_URL || true
          cd client
          node scripts/patch-capgo-podspec.js
          npx cap sync ios
          test -d ios/App/App/public
          echo "OK: copied web bundle to ios/App/App/public"
      - name: Verify bundled Capacitor config (App Store 4.2.2)
        script: |
          set -euo pipefail
          CFG="client/ios/App/App/capacitor.config.json"
          test -f "$CFG"
          if grep -q '"server"' "$CFG"; then
            echo "ERROR: capacitor.config.json must NOT use live server.url for App Review" >&2
            cat "$CFG"
            exit 1
          fi
          echo "OK: bundled Capacitor shell (no live WebView URL)"
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Refresh App Store profile with Push + Associated Domains
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/scripts/codemagic-refresh-push-profile.sh"
      - name: Set next TestFlight build number
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/scripts/codemagic-set-next-build-number.sh"
      - name: Verify iOS app icon (1024×1024)
        script: |
          set -euo pipefail
          cd client
          node scripts/verify-ios-app-icon.js
      - name: Build IPA for App Store
        script: |
          set -euo pipefail
          PROFILE_FILE="$(cat /tmp/gatorvault_push_profile.path 2>/dev/null || true)"
          PROFILE_NAME="$(cat /tmp/gatorvault_push_profile.name 2>/dev/null || true)"
          if [[ -z "${PROFILE_FILE}" || ! -f "${PROFILE_FILE}" ]]; then
            echo "ERROR: Push + Associated Domains profile path missing — refresh step did not run?" >&2
            exit 1
          fi
          PROFILE_PLIST="$(security cms -D -i "${PROFILE_FILE}")"
          if ! printf '%s' "${PROFILE_PLIST}" | grep -q 'aps-environment'; then
            echo "ERROR: profile ${PROFILE_NAME:-unknown} lacks aps-environment" >&2
            exit 1
          fi
          if ! printf '%s' "${PROFILE_PLIST}" | grep -q 'com.apple.developer.associated-domains'; then
            echo "ERROR: profile ${PROFILE_NAME:-unknown} lacks com.apple.developer.associated-domains" >&2
            exit 1
          fi
          echo "Archiving with profile: ${PROFILE_NAME} (${PROFILE_FILE})"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/client/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            || {
              echo "ERROR: build-ipa failed — last xcodebuild log tail:" >&2
              ls -1t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1 | xargs -I{} tail -n 80 {} >&2 || true
              exit 65
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TestFlight only. Do not set release_type / cancel_previous_submissions
        # unless submit_to_app_store is true (Codemagic YAML validation requires it).
        submit_to_app_store: false
