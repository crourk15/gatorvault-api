# GatorVault Insider — Netlify (gatorvaultinsider.com)
# Publishes server/ static vault + FutureCast Next.js export (client/out merged at build).
#
# Recovery deploy (chunk mismatch / stale HTML):
#   npm run deploy:netlify:full   # clean + build + hook + CDN purge (needs env vars)
#   npm run deploy:netlify:local  # clean + build only
#   npm run purge:netlify-cdn     # CDN purge after deploy
#
# ROUTING: All /vault/* and SPA rewrites live in server/_redirects, regenerated on every
# build from client/lib/routes.js (via client/scripts/generate-redirects.js).
# Do NOT duplicate vault rewrites here — conflicting rules can 403 crawlers.
# Do NOT point /vault/* at /.netlify/functions/server — static export, not SSR.

[build]
  command = "npm run build:netlify"
  publish = "server"

[build.environment]
  NODE_VERSION = "20"

# Proxy API through same origin — no external API URLs in the browser
[[redirects]]
  from = "/api/*"
  to = "https://gatorvault-api.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/hub-snapshot/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=600"

[[headers]]
  for = "/page-snapshot/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=600"

# Vault SPA fallback — detailed per-route rewrites live in server/_redirects (generated at build).
# This catch-all only applies when no more-specific rule matches.
[[redirects]]
  from = "/vault/*"
  to = "/vault/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/vault/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/futurecast/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/welcome/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/join/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/recruiting-hub/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/js/vault-route-manifest.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/build-manifest.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/ops-version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/vault-chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
