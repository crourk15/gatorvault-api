# GatorVault Insider — Netlify (gatorvaultinsider.com)
# Publishes server/ static vault + FutureCast Next.js export (client/out merged at build).
#
# ROUTING: All /vault/* and SPA rewrites live in server/_redirects, regenerated on every
# build from client/lib/routes.js (via client/scripts/generate-redirects.js).
# Do NOT duplicate vault rewrites here — conflicting rules can 403 crawlers.
# Do NOT point /vault/* at /.netlify/functions/server — static export, not SSR.

[build]
  command = "npm run build:netlify"
  publish = "server"

[build.environment]
  NODE_VERSION = "20"

# Proxy API through same origin — no external API URLs in the browser
[[redirects]]
  from = "/api/*"
  to = "https://gatorvault-api.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/vault/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/futurecast/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/build-manifest.json"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/ops-version.json"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/api/futurecast/home"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=600, stale-while-revalidate=60"

[[headers]]
  for = "/api/futurecast/class"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=600, stale-while-revalidate=60"

[[headers]]
  for = "/api/futurecast/predictions"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=600, stale-while-revalidate=60"

[[headers]]
  for = "/api/futurecast/staff-notes"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=600, stale-while-revalidate=60"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/vault-chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
