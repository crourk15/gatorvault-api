# GatorVault Insider — Netlify (gatorvaultinsider.com)
# Publishes server/ static vault + FutureCast Next.js export (client/out merged at build).
#
# Recovery deploy (chunk mismatch / stale HTML):
#   npm run deploy:netlify:full   # clean + build + hook + CDN purge (needs env vars)
#   npm run deploy:netlify:local  # clean + build only
#   npm run purge:netlify-cdn     # CDN purge after deploy
#
# ROUTING: All /vault/* and SPA rewrites live in server/_redirects, regenerated on every
# build from client/lib/routes.js (via client/scripts/generate-redirects.js).
# Do NOT duplicate vault rewrites here — conflicting rules can 403 crawlers.
# Do NOT point /vault/* at /.netlify/functions/server — static export, not SSR.

[build]
  command = "npm run build:netlify"
  publish = "server"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Skip Netlify build-cache restore — stale .next/_next/static caused mismatched layout chunk hashes.
  NETLIFY_SKIP_BUILD_CACHE = "true"
  # Apple Team ID (same as Xcode DEVELOPMENT_TEAM) — fills AASA appIDs for universal links.
  APPLE_TEAM_ID = "45C4DZJ4UJ"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[functions."share-player"]
  included_files = ["server/data/share/og-players.json", "server/data/recruiting/players.json", "server/assets/fonts/Arimo-Bold.ttf", "netlify/functions/share-fonts/Arimo-Bold.ttf"]

[[edge_functions]]
  function = "player-share-bots"
  path = "/vault/futurecast/player/*"

[[edge_functions]]
  function = "player-share-bots"
  path = "/vault/recruiting/player/*"

# Disable Netlify post-processing — optimization layer rewrites HTML/RSC with stale chunk hashes.
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false
  skip = true

[build.processing.js]
  minify = false
  bundle = false
  skip = true

[build.processing.css]
  minify = false
  skip = true

[build.processing.images]
  compress = false
  skip = true


# Scrub denied visit stones (Tranard Auburn UV) on the iOS same-origin API path.
[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/hub/ticker"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/hub/ticker/*"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/hub/bundle"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/hub/bundle/*"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/hub/movement-feed"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/hub/movement-feed/*"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/hub/hero"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/players/*"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/recruiting/intelligence/*"

[[edge_functions]]
  function = "scrub-denied-visits"
  path = "/api/player/full-profile/*"


# Proxy API through same origin — no external API URLs in the browser
[[redirects]]
  from = "/api/*"
  to = "https://gatorvault-api.onrender.com/api/:splat"
  status = 200
  force = true

# Static snapshots disabled — all data loads from live API
[[redirects]]
  from = "/hub-snapshot/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/page-snapshot/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/hub-snapshot/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/page-snapshot/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

# Vault SPA fallback — detailed per-route rewrites live in server/_redirects (generated at build).
# This catch-all only applies when no more-specific rule matches.
[[redirects]]
  from = "/vault/*"
  to = "/vault/index.html"
  status = 200

