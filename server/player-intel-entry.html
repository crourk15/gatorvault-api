<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GatorVault — Player Intel Entry</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root { --bg:#030712; --panel:#0b1220; --border:#1e293b; --text:#e8edf5; --muted:#8b9bb4; --orange:#fa4616; --green:#22c55e; --red:#ef4444; }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}
    h1{margin:0;font-family:Oswald,sans-serif;font-size:1.15rem;letter-spacing:.04em}
    .sub{font-size:.75rem;color:var(--muted)}
    main{padding:1rem 1.25rem 3rem;max-width:960px;margin:0 auto}
    input,button,select{font:inherit}
    input,select{background:var(--panel);border:1px solid #334155;color:var(--text);padding:.55rem .75rem;border-radius:.5rem;width:100%}
    button{background:var(--orange);color:#fff;border:0;padding:.55rem .9rem;border-radius:.5rem;cursor:pointer;font-weight:600}
    button.secondary{background:#334155}
    button:disabled{opacity:.5;cursor:not-allowed}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:.85rem;padding:1rem;margin-bottom:1rem}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
    @media(max-width:720px){.grid{grid-template-columns:1fr}}
    label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;margin-bottom:.25rem}
    .field{margin-bottom:.75rem}
    .actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
    .pin-gate{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
    .pin-card{background:var(--panel);border:1px solid var(--border);border-radius:1rem;padding:1.5rem;max-width:380px;width:100%}
    .hidden{display:none!important}
    .ok{color:var(--green);font-size:.85rem}
    .warn{color:#fbbf24;font-size:.85rem;font-weight:600}
    .err{color:var(--red);font-size:.85rem}
    pre{background:#020617;border:1px solid var(--border);border-radius:.5rem;padding:.75rem;font-size:.72rem;overflow:auto;max-height:360px}
    .meta{font-size:.8rem;color:var(--muted);line-height:1.5}
    a{color:#60a5fa}
  </style>
  <script src="/js/admin-embed.js?v=3"></script>
</head>
<body>
  <div id="pin-gate" class="pin-gate">
    <div class="pin-card">
      <h1>Player Intel Entry</h1>
      <p class="sub" style="margin:.5rem 0 1rem">Admin PIN required.</p>
      <input id="gate-pin" type="password" placeholder="Admin PIN" autocomplete="off" style="margin-bottom:.75rem" />
      <button id="gate-unlock" style="width:100%">Unlock</button>
      <p id="gate-err" class="hidden err">Invalid PIN</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div>
        <h1>Player Intel Entry</h1>
        <div class="sub">Name + class + offer → On3 profile, boards, snapshots</div>
        <p class="warn" style="margin:.35rem 0 0;font-size:.75rem;text-transform:none">
          Real On3 intel only — no placeholders. Preview must show a verified On3 match before save.
        </p>
      </div>
      <input id="pin" type="password" placeholder="PIN" autocomplete="off" style="width:140px" />
    </header>
    <main>
      <div class="panel">
        <div class="grid">
          <div class="field">
            <label>Player name</label>
            <input id="name" type="text" placeholder="e.g. Jalen Brewster" />
          </div>
          <div class="field">
            <label>Class year</label>
            <select id="classYear">
              <option value="2027">2027</option>
              <option value="2028">2028</option>
              <option value="2029">2029</option>
              <option value="2030">2030</option>
            </select>
          </div>
          <div class="field">
            <label>UF offer?</label>
            <select id="offer">
              <option value="yes">Yes — Florida offer</option>
              <option value="no">No offer yet</option>
            </select>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:.5rem;font-size:.8rem;text-transform:none;color:var(--text);margin-top:.5rem">
          <input id="rebuildSnapshots" type="checkbox" checked style="width:auto" />
          Rebuild page + hub snapshots after save
        </label>
        <div class="actions">
          <button id="preview" class="secondary">Preview On3 match</button>
          <button id="submit" disabled>Create / update player intel</button>
        </div>
        <p id="status" class="meta" style="margin-top:.75rem"></p>
      </div>

      <div class="panel hidden" id="result-panel">
        <h2 style="margin:0 0 .5rem;font-size:.95rem">Result</h2>
        <div id="summary" class="meta"></div>
        <pre id="json-out"></pre>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var SESSION = 'gv_admin_pin';
      var API = (function () {
        var host = (location.hostname || '').toLowerCase();
        if (host === 'localhost' || host === '127.0.0.1') return 'http://localhost:3000';
        return location.origin;
      })();

      function pin() {
        if (window.GVAdminEmbed) return GVAdminEmbed.getPin();
        var el = document.getElementById('pin');
        return (el && el.value ? el.value.trim() : '') || sessionStorage.getItem(SESSION) || '';
      }

      function headers() {
        return {
          'Content-Type': 'application/json',
          Accept: 'application/json',
          'X-Recruiting-Pin': pin()
        };
      }

      function payload() {
        return {
          pin: pin(),
          name: document.getElementById('name').value.trim(),
          classYear: parseInt(document.getElementById('classYear').value, 10),
          offer: document.getElementById('offer').value === 'yes' ? 'uf' : 'no',
          rebuildSnapshots: document.getElementById('rebuildSnapshots').checked
        };
      }

      var lastPreviewCanEnter = false;

      function showResult(data, ok) {
        document.getElementById('result-panel').classList.remove('hidden');
        var summary = document.getElementById('summary');
        if (ok && data.slug && !data.preview) {
          summary.innerHTML =
            '<span class="ok">Saved ' + data.name + ' (' + data.slug + ')</span><br>' +
            'Section: <strong>' + (data.placement && data.placement.section) + '</strong><br>' +
            (data.profileUrl ? '<a href="' + data.profileUrl + '" target="_blank" rel="noopener">Open profile →</a>' : '');
        } else if (ok && data.preview) {
          lastPreviewCanEnter = data.canEnter === true;
          document.getElementById('submit').disabled = !lastPreviewCanEnter;
          var iq = data.intelQuality || {};
          var verifyLine = lastPreviewCanEnter
            ? '<span class="ok">On3 verified — ready to save.</span>'
            : '<span class="err">' + (iq.message || 'On3 profile not verified — cannot save.') + '</span>';
          summary.innerHTML =
            '<span class="warn">Preview only — nothing saved yet.</span><br>' +
            verifyLine + '<br>' +
            'Match: <strong>' + data.name + ' (' + data.slug + ')</strong><br>' +
            'Would land in: <strong>' + (data.placement && data.placement.section) + '</strong><br>' +
            (lastPreviewCanEnter
              ? 'Click <strong>Create / update player intel</strong> to publish to allowlist + boards.'
              : 'Fix the On3 match or use beat-writer ingest — placeholder intel is blocked.');
        } else {
          summary.innerHTML = '<span class="err">' + (data.error || 'Request failed') + '</span>';
        }
        document.getElementById('json-out').textContent = JSON.stringify(data, null, 2);
      }

      async function postOnce(path, body) {
        var res = await fetch(API + path, { method: 'POST', headers: headers(), body: JSON.stringify(body) });
        var text = await res.text();
        var data;
        try {
          data = text ? JSON.parse(text) : {};
        } catch (e) {
          var preview = (text || '').trim().slice(0, 120);
          if (/^\s*</.test(preview)) {
            throw new Error('API unavailable — received HTML instead of JSON (Render may be down or cold starting).');
          }
          throw new Error('Invalid JSON response from API.');
        }
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      }

      async function post(path, body) {
        var lastErr;
        for (var attempt = 0; attempt < 5; attempt++) {
          try {
            return await postOnce(path, body);
          } catch (err) {
            lastErr = err;
            var msg = String(err && err.message ? err.message : err);
            var retry = /503|502|504|unavailable|warming|cold|html instead of json/i.test(msg);
            if (!retry || attempt >= 4) throw err;
            await new Promise(function (resolve) { setTimeout(resolve, 2000 * (attempt + 1)); });
          }
        }
        throw lastErr;
      }

      window.__gvAdminEmbedUnlock = function (p) {
        if (!p) return;
        document.getElementById('pin').value = p;
        document.getElementById('gate-pin').value = p;
        sessionStorage.setItem(SESSION, p);
        document.getElementById('pin-gate').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      };

      document.getElementById('gate-unlock').onclick = function () {
        var p = document.getElementById('gate-pin').value.trim();
        if (!p) return;
        if (window.GVAdminEmbed) {
          GVAdminEmbed.verifyPin(p, function (ok) {
            if (ok) GVAdminEmbed.applyPin(p);
            else document.getElementById('gate-err').classList.remove('hidden');
          });
          return;
        }
        document.getElementById('pin').value = p;
        sessionStorage.setItem(SESSION, p);
        document.getElementById('pin-gate').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      };

      if (window.GVAdminEmbed) {
        GVAdminEmbed.whenReady(function () { /* session inherited from hub */ });
      } else {
        var saved = sessionStorage.getItem(SESSION);
        if (saved) {
          document.getElementById('pin').value = saved;
          document.getElementById('pin-gate').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
        }
      }

      document.getElementById('preview').onclick = async function () {
        var status = document.getElementById('status');
        status.textContent = 'Fetching On3 preview…';
        try {
          var data = await post('/api/admin/player-intel/preview', payload());
          showResult(data, true);
          status.textContent = 'Preview ready — review JSON, then click Create / update to publish.';
        } catch (e) {
          status.textContent = '';
          showResult({ error: e.message }, false);
        }
      };

      document.getElementById('submit').onclick = async function () {
        var btn = document.getElementById('submit');
        var status = document.getElementById('status');
        if (!lastPreviewCanEnter) {
          showResult(
            {
              error:
                'Run Preview first and confirm On3 verified match. Placeholder intel is blocked.',
            },
            false
          );
          return;
        }
        btn.disabled = true;
        status.textContent = 'Running full intel pipeline (On3 → store → boards → snapshots)…';
        try {
          var data = await post('/api/admin/player-intel/entry', payload());
          showResult(data, true);
          status.textContent = 'Complete — player intel updated across boards.';
        } catch (e) {
          status.textContent = '';
          showResult({ error: e.message }, false);
        } finally {
          btn.disabled = false;
        }
      };
    })();
  </script>
</body>
</html>
