<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GatorVault — Admin Hub</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/gv-feedback.css?v=2">
  <style>
    *{box-sizing:border-box}
    :root{
      --hub-bg:#030712;--hub-panel:#0b1220;--hub-border:#1e3a5f;--hub-text:#e2e8f0;
      --hub-muted:#94a3b8;--hub-orange:#FA4616;--hub-sidebar:240px;
    }
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--hub-bg);color:var(--hub-text);min-height:100vh}
    .hidden{display:none!important}
    .admin-pin-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px}
    .admin-pin-card{background:var(--hub-panel);border:1px solid var(--hub-border);border-radius:16px;padding:28px;width:100%;max-width:400px}
    .admin-pin-card h1{margin:0 0 6px;font-family:Oswald,sans-serif;color:#fff;font-size:1.35rem;letter-spacing:.04em}
    .admin-pin-card p{color:var(--hub-muted);font-size:14px;margin:0 0 18px;line-height:1.45}
    .admin-pin-card label{display:block;font-size:11px;color:var(--hub-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
    .admin-pin-card input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#f8fafc;font:inherit;margin-bottom:8px}
    .hub-btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--hub-orange);color:#fff;font-size:13px;min-height:44px;touch-action:manipulation}
    .hub-btn.secondary{background:#1e3a5f;color:var(--hub-text)}
    .hub-btn:disabled{opacity:.55;cursor:not-allowed}
    .err{color:#f87171;font-size:12px}

    #hub-shell{display:flex;min-height:100vh}
    .hub-sidebar{
      width:var(--hub-sidebar);flex-shrink:0;background:linear-gradient(180deg,#0a1628,#060f1a);
      border-right:2px solid #003087;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    }
    .hub-brand{padding:18px 16px 14px;border-bottom:1px solid var(--hub-border)}
    .hub-brand h1{margin:0;font-family:Oswald,sans-serif;font-size:1.1rem;color:var(--hub-orange);letter-spacing:.06em}
    .hub-brand p{margin:4px 0 0;font-size:11px;color:var(--hub-muted);line-height:1.35}
    .hub-nav{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:4px}
    .hub-nav-btn{
      display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:var(--hub-muted);
      padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
      min-height:44px;-webkit-tap-highlight-color:transparent;position:relative;
    }
    .hub-health-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#64748b}
    .hub-health-green{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.45)}
    .hub-health-yellow{background:#eab308;box-shadow:0 0 8px rgba(234,179,8,.45)}
    .hub-health-red{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.55)}
    .hub-nav-btn:hover{background:rgba(0,48,135,.25);color:#e2e8f0}
    .hub-nav-btn.active{background:rgba(250,70,22,.15);color:#fff;border:1px solid rgba(250,70,22,.35)}
    .hub-nav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
    .hub-sidebar-foot{padding:12px;border-top:1px solid var(--hub-border);display:flex;flex-direction:column;gap:8px}
    .hub-sidebar-foot a,.hub-sidebar-foot button{font-size:12px;color:var(--hub-muted);text-decoration:none;background:transparent;border:none;text-align:left;padding:8px 12px;cursor:pointer;font:inherit}
    .hub-sidebar-foot a:hover,.hub-sidebar-foot button:hover{color:#fff}

    .hub-main{flex:1;min-width:0;display:flex;flex-direction:column;max-height:100vh}
    .hub-topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;
      border-bottom:1px solid var(--hub-border);background:rgba(3,7,18,.95);backdrop-filter:blur(8px);flex-shrink:0;flex-wrap:wrap;
    }
    .hub-topbar-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
    .hub-topbar h2{margin:0;font-family:Oswald,sans-serif;font-size:1.15rem;color:#fff;white-space:nowrap}
    .hub-topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .hub-search-wrap{position:relative;flex:1;max-width:420px;min-width:180px}
    .hub-search-wrap input{width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font:inherit;font-size:13px}
    .hub-search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7;pointer-events:none}
    .hub-search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#0b1220;border:1px solid #334155;border-radius:12px;max-height:320px;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.5)}
    .hub-search-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #1e293b;color:#e2e8f0;padding:10px 12px;cursor:pointer;font:inherit}
    .hub-search-item:hover{background:rgba(250,70,22,.1)}
    .hub-search-type{display:block;font-size:10px;text-transform:uppercase;color:#64748b;letter-spacing:.05em}
    .hub-search-empty{padding:12px;font-size:12px;color:#94a3b8}
    .hub-env-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
    .hub-env-prod{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.35)}
    .hub-env-stage{background:rgba(234,179,8,.12);color:#fde047;border:1px solid rgba(234,179,8,.35)}
    .hub-api-banner{background:#451a03;border-bottom:1px solid #ea580c;color:#fed7aa;padding:10px 20px;font-size:13px;line-height:1.45;flex-shrink:0}
    .hub-api-banner.hidden{display:none!important}
    .hub-alerts-btn{position:relative;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;min-height:40px}
    .hub-alerts-btn[data-count]:not([data-count=""])::after{content:attr(data-count);position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
    .hub-alerts-panel{position:absolute;right:20px;top:62px;width:min(360px,calc(100vw - 32px));background:#0b1220;border:1px solid #334155;border-radius:12px;padding:12px;z-index:60;box-shadow:0 16px 40px rgba(0,0,0,.5);max-height:360px;overflow:auto}
    .hub-alert-item{padding:10px 0;border-bottom:1px solid #1e293b;font-size:13px}
    .hub-alert-item strong{display:block;color:#f8fafc;margin-bottom:4px}
    .hub-alert-item span{color:#94a3b8;font-size:12px}
    .hub-main-wrap{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;max-height:100vh}
    .hub-content{flex:1;overflow:auto;padding:16px 20px 32px;-webkit-overflow-scrolling:touch}
    .hub-section-head{margin-bottom:14px}
    .hub-section-head h2{margin:0 0 4px;font-family:Oswald,sans-serif;font-size:1.25rem;color:#fff}
    .hub-section-head p{margin:0;font-size:13px;color:var(--hub-muted)}

    .hub-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .hub-tab{border:1px solid var(--hub-border);background:var(--hub-panel);color:var(--hub-muted);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font:inherit;min-height:36px}
    .hub-tab.active{background:var(--hub-orange);border-color:var(--hub-orange);color:#fff}

    .hub-panel{min-height:480px}
    .hub-iframe{width:100%;min-height:calc(100vh - 180px);border:1px solid var(--hub-border);border-radius:12px;background:#020617}

    .hub-settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .hub-card{background:var(--hub-panel);border:1px solid var(--hub-border);border-radius:12px;padding:16px}
    .hub-card-wide{grid-column:1/-1}
    .hub-card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--hub-muted)}
    .hub-card label{display:block;font-size:11px;color:var(--hub-muted);margin:10px 0 6px;text-transform:uppercase}
    .hub-card input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #334155;background:#111827;color:#f8fafc;font:inherit;margin-bottom:8px}
    .hub-btn-row{display:flex;flex-wrap:wrap;gap:8px}
    .hub-meta{font-size:12px;color:var(--hub-muted);line-height:1.5;margin:8px 0}
    .hub-meta code{font-size:11px;color:#93c5fd}
    .hub-tier-list{font-size:12px;color:#cbd5e1;padding-left:18px;margin:8px 0 0}
    .hub-log{background:#020617;border:1px solid #1e293b;border-radius:10px;padding:12px;min-height:100px;max-height:220px;overflow:auto;font-family:ui-monospace,monospace;font-size:11px}
    .hub-log .ok{color:#4ade80}.hub-log .err{color:#f87171}.hub-log .info{color:#93c5fd}

    /* Vault Grades Manager */
    .vge-grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:960px){.vge-grid{grid-template-columns:1fr 1fr}}
    .vge-search-wrap{position:relative}
    .vge-suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#0b1220;border:1px solid #334155;border-radius:10px;max-height:280px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.45)}
    .vge-suggest-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #1e293b;color:#e2e8f0;padding:10px 12px;cursor:pointer;font:inherit}
    .vge-suggest-item:hover,.vge-suggest-item:focus{background:rgba(250,70,22,.12);outline:none}
    .vge-suggest-name{display:block;font-weight:700;font-size:13px}
    .vge-suggest-meta{display:block;font-size:11px;color:#94a3b8;margin-top:2px}
    .vge-suggest-empty{padding:12px;font-size:12px;color:#94a3b8}
    .vge-identity{background:#020617;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:12px}
    .vge-identity.vge-empty{color:#94a3b8;font-size:13px}
    .vge-id-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .vge-id-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:4px}
    .vge-current-grade{color:#fbbf24!important}
    .vge-grade-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .vge-grade-row input[type=number]{width:120px;margin:0}
    .vge-range{font-weight:400;text-transform:none;letter-spacing:0;color:#64748b}
    .vge-toast{position:fixed;bottom:24px;right:24px;z-index:10001;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:min(360px,calc(100vw - 32px))}
    .vge-toast-ok{background:#14532d;color:#bbf7d0;border:1px solid #22c55e}
    .vge-toast-err{background:#450a0a;color:#fecaca;border:1px solid #ef4444}
    .vge-toast-info{background:#1e3a5f;color:#bfdbfe;border:1px solid #3b82f6}

    /* Command center dashboard */
    .hub-dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
    .hub-dash-title{margin:0;font-family:Oswald,sans-serif;font-size:1.35rem;color:#fff}
    .hub-dash-sub{margin:4px 0 0;font-size:13px;color:var(--hub-muted)}
    .hub-dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .hub-dash-overall .hub-overall-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
    .hub-overall-label{display:block;font-size:11px;color:var(--hub-muted);text-transform:uppercase}
    .hub-overall-val{font-family:Oswald,sans-serif;font-size:1.6rem;color:#fff}
    .hub-issue-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
    .hub-issue{display:flex;gap:12px;padding:12px;border-radius:10px;background:#020617;border:1px solid #1e293b}
    .hub-issue-num{font-weight:700;color:#64748b;min-width:20px}
    .hub-issue-body strong{display:block;color:#f8fafc;margin-bottom:4px;font-size:13px}
    .hub-issue-body span{display:block;color:#94a3b8;font-size:12px}
    .hub-issue-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
    .hub-link-btn{background:transparent;border:0;color:#93c5fd;font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0}
    .hub-st-red{border-color:rgba(239,68,68,.35)}.hub-st-yellow{border-color:rgba(234,179,8,.35)}.hub-st-green{border-color:rgba(34,197,94,.25)}
    .hub-mod-grid{display:flex;flex-wrap:wrap;gap:8px}
    .hub-mod-card{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
    .hub-mod-dot{width:8px;height:8px;border-radius:50%;background:#64748b}
    .hub-st-red .hub-mod-dot,.hub-st-red.hub-mod-card .hub-mod-dot{background:#ef4444}
    .hub-st-yellow .hub-mod-dot,.hub-st-yellow.hub-mod-card .hub-mod-dot{background:#eab308}
    .hub-st-green .hub-mod-dot,.hub-st-green.hub-mod-card .hub-mod-dot{background:#22c55e}
    .hub-pipe-grid{display:flex;flex-direction:column;gap:8px}
    .hub-pipe{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#020617;border:1px solid #1e293b}
    .hub-pipe-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:#64748b}
    .hub-pipe strong{display:block;font-size:13px;color:#f8fafc}
    .hub-pipe span{display:block;font-size:12px;color:#94a3b8;margin-top:2px}
    .hub-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    .hub-stat{padding:12px;border-radius:10px;background:#020617;border:1px solid #1e293b}
    .hub-stat-label{display:block;font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:4px}
    .hub-stat-val{display:block;font-size:12px;color:#e2e8f0;line-height:1.4}
    .hub-dash-loading{font-size:13px;color:var(--hub-muted);padding:24px 0}
    .hub-dash-ts{font-size:11px;color:var(--hub-muted)}
    .hub-pipe-grid .hub-st-red .hub-pipe-dot{background:#ef4444}
    .hub-pipe-grid .hub-st-yellow .hub-pipe-dot{background:#eab308}
    .hub-pipe-grid .hub-st-green .hub-pipe-dot{background:#22c55e}

    @media(max-width:900px){
      #hub-shell{flex-direction:column}
      .hub-sidebar{width:100%;height:auto;position:relative;border-right:0;border-bottom:2px solid #003087}
      .hub-nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:8px}
      .hub-nav-btn{flex:0 0 auto;white-space:nowrap;padding:8px 12px}
      .hub-nav-label{font-size:12px}
      .hub-sidebar-foot{display:none}
      .hub-main{max-height:none}
      .hub-iframe{min-height:70vh}
    }
  </style>
</head>
<body>
  <div id="admin-pin-gate" class="admin-pin-ov" role="dialog" aria-modal="true">
    <div class="admin-pin-card">
      <h1>🐊 GatorVault Admin Hub</h1>
      <p>One login. One control panel. Enter your operator PIN to manage recruiting, team, content, community, GM2, and platform settings.</p>
      <label for="gate-pin">Admin PIN</label>
      <input id="gate-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Admin PIN">
      <p id="gate-err" class="err hidden">Invalid PIN</p>
      <button type="button" class="hub-btn" id="gate-submit" style="width:100%;margin-top:12px">Unlock Control Panel</button>
    </div>
  </div>

  <div id="hub-shell" class="hidden">
    <aside class="hub-sidebar">
      <div class="hub-brand">
        <h1>GatorVault Admin Hub</h1>
        <p>Unified command center</p>
      </div>
      <nav id="hub-nav" class="hub-nav" aria-label="Admin sections"></nav>
      <div class="hub-sidebar-foot">
        <a href="/admin/hub#qa/monitor">🛡️ QA Monitor</a>
        <a href="/admin/hub#product-intel/health">🧠 Product Health</a>
        <a href="/" target="_blank" rel="noopener">↗ Open public site</a>
        <button type="button" id="hub-lock">🔒 Lock &amp; sign out</button>
      </div>
    </aside>
    <div class="hub-main-wrap">
      <header class="hub-topbar">
        <div class="hub-topbar-left">
          <h2 id="hub-page-title">Dashboard</h2>
          <div class="hub-search-wrap">
            <input id="hub-global-search" type="search" placeholder="Search players, articles, users…" autocomplete="off" aria-label="Global admin search">
            <div id="hub-search-results" class="hub-search-results hidden"></div>
          </div>
        </div>
        <div class="hub-topbar-actions">
          <span id="hub-env-badge" class="hub-env-badge hub-env-stage">Stage</span>
          <button type="button" class="hub-alerts-btn" id="hub-alerts-btn" title="Alerts">🔔</button>
          <button type="button" class="hub-btn secondary" id="hub-lock-top">Lock</button>
        </div>
      </header>
      <div id="hub-api-banner" class="hub-api-banner hidden" role="alert"></div>
      <div id="hub-alerts-panel" class="hub-alerts-panel hidden"></div>
      <div id="hub-main" class="hub-content"></div>
    </div>
  </div>

  <script src="/js/admin-api-fetch.js?v=1"></script>
  <script src="/js/vault-grade-editor.js?v=vge-20260611"></script>
  <script src="/js/admin-hub-dashboard.js?v=hub-dash-v5"></script>
  <script src="/js/admin-hub-core.js?v=hub-v14-api"></script>
  <script>
    document.getElementById('hub-lock-top').addEventListener('click', function () {
      document.getElementById('hub-lock').click();
    });
  </script>
  <script src="/gv-feedback.js?v=1" defer></script>
</body>
</html>
