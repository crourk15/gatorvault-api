# Manual-only Codemagic ios-release trigger.
# Charles starts iOS builds from Codemagic (or GitHub Actions → Run workflow).
# Requires repo secret: CODEMAGIC_API_TOKEN
# App ID defaults to the gatorvault-api Codemagic application (override via secret if needed).
name: iOS TestFlight (Codemagic)

on:
  workflow_dispatch:

jobs:
  trigger-codemagic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Trigger Codemagic ios-release
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
          CODEMAGIC_BRANCH: main
          CODEMAGIC_WORKFLOW: ios-release
        run: |
          export CODEMAGIC_APP_ID="${CODEMAGIC_APP_ID:-6a3ae08903d4d93cf0d1a5de}"
          if [ -z "${CODEMAGIC_API_TOKEN}" ]; then
            echo "::warning::CODEMAGIC_API_TOKEN not set — skip Codemagic trigger. Add the secret or run Codemagic manually."
            exit 0
          fi
          npm run trigger:codemagic:ios
