        value: https://gatorvault-api.onrender.com/api/ping
      - key: KEEPALIVE_HUB_URL
        value: https://gatorvault-api.onrender.com/api/recruiting/hub/class-overview?year=2027

  # Beat ingest cron — hardened with API warm check, retries, soft failures (always exit 0).
  # Optional future: move to a dedicated worker service to isolate from API deploys.
  - type: cron
    name: gatorvault-api-beat-ingest
    schedule: "*/10 * * * *"
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node scripts/render-beat-ingest-cron.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
