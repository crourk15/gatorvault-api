      - key: BEAT_LATE_INGEST_INTERVAL_MS
        value: "300000"
      - key: BEAT_LATE_INGEST_BOOT_DELAY_MS
        value: "60000"
      - key: MONITORING_INGEST_STALE_MS
        value: "7200000"
      - key: MONITORING_BEAT_STALE_MS
