  - type: cron
    name: gatorvault-api-keepalive
    schedule: "*/2 * * * *"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-keepalive-ping.js
    envVars:
      - key: KEEPALIVE_URL
        value: https://gatorvault-api.onrender.com/health
      - key: KEEPALIVE_PING_URL
        value: https://gatorvault-api.onrender.com/api/ping
      - key: KEEPALIVE_HUB_URL
        value: https://gatorvault-api.onrender.com/api/recruiting/hub/class-overview?year=2027

  # Beat ingest cron — hardened with API warm check, retries, soft failures (always exit 0).
  # Optional future: move to a dedicated worker service to isolate from API deploys.
  - type: cron
    name: gatorvault-api-beat-ingest
    schedule: "*/10 * * * *"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-beat-ingest-cron.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
    name: gatorvault-api-recruiting-ingest
    schedule: "0 */2 * * *"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-recruiting-ingest-cron.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: RIVALS_PM_INGEST_ENABLED
        value: "true"
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
    name: gatorvault-api-hub-refresh
    schedule: "0 */6 * * *"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-hub-refresh-cron.js
    envVars:
      - key: HUB_REFRESH_URL
        value: https://gatorvault-api.onrender.com/api/recruiting/hub/refresh?geoBackfill=true
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
    name: gatorvault-api-visit-intel-reconcile
    schedule: "15 */3 * * *"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-visit-intel-reconcile-cron.js
    envVars:
      - key: VISIT_INTEL_RECONCILE_URL
        value: https://gatorvault-api.onrender.com/api/futurecast/visit-intel/reconcile
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
    name: gatorvault-api-visit-intel-recap
    schedule: "0 14 * * 1"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-visit-intel-recap-cron.js
    envVars:
      - key: VISIT_INTEL_RECAP_URL
        value: https://gatorvault-api.onrender.com/api/futurecast/visit-intel/recap
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
    name: gatorvault-api-visit-intel-daily-digest
    schedule: "0 14 * * *"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-visit-intel-daily-digest-cron.js
