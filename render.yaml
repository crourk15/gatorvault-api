# GatorVault API — Render Blueprint
# Dashboard: New → Blueprint → connect repo → Deploy Blueprint
# Secrets (sync: false) are prompted in Render; paste values from server/.env
#
# DEPLOYMENT: gatorvault-api on Render auto-deploys from `main` only.
# Use feature/release branches as needed; merge into `main` when ready for production.
# `main` is the single source of truth — Render will redeploy automatically on push.

services:
  - type: web
    name: gatorvault-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://gatorvaultinsider.com
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: EMAIL_PROVIDER
        value: emailjs
      - key: ON3_INGEST_ENABLED
        value: "true"
      - key: ON3_INGEST_INTERVAL_MS
        value: "120000"
      - key: ON3_CLASS_YEARS
        value: "2026,2027,2028,2029"
      - key: ON3_ORG_SLUG
        value: "florida-gators"
      - key: ON3_SITE_BASE
        value: "https://www.on3.com"
      - key: ON3_INGEST_BOOT_DELAY_MS
        value: "15000"
      - key: RIVALS_PM_INGEST_ENABLED
        value: "true"
      - key: RIVALS_PM_INTERVAL_MS
        value: "300000"
      - key: RIVALS_PM_CLASS_YEARS
        value: "2027,2028,2029"
      - key: RIVALS_PM_BOOT_DELAY_MS
        value: "60000"
      - key: SESSION_SECRET
        generateValue: true
      - key: PUSH_ALERTS_ENABLED
        value: "true"
      - key: VAPID_SUBJECT
        value: "mailto:support@gatorvaultinsider.com"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: EMAILJS_USER_ID
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_REPLY_TO
