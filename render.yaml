# GatorVault API — Render Blueprint
# Dashboard: New → Blueprint → connect repo → Deploy Blueprint
# Secrets (sync: false) are prompted in Render; paste values from server/.env
#
# DEPLOYMENT: gatorvault-api on Render auto-deploys from `main` only.
# Use feature/release branches as needed; merge into `main` when ready for production.
# `main` is the single source of truth — Render will redeploy automatically on push.

services:
  - type: web
    name: gatorvault-api
    runtime: node
    plan: standard
    region: oregon
    rootDir: server
    buildCommand: npm install && node scripts/platform-guardian-predeploy.js
    startCommand: node server.js
    healthCheckPath: /ready
    # Member accounts + trial ledger must survive Render redeploys.
    # Without this disk, users.json is wiped and sign-in returns "incorrect password".
    disk:
      name: gatorvault-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://gatorvaultinsider.com
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: GV_USERS_PATH
        value: /var/data/users.json
      - key: GV_TRIAL_LEDGER_PATH
        value: /var/data/trial-ledger.json
      # Beat/X live pool + feed caches — same disk so redeploys do not empty GatorNation Live.
      - key: GV_LIVE_DATA_DIR
        value: /var/data/live
      # Community UGC (threads/replies) — same disk so redeploys do not wipe the board.
      - key: GV_COMMUNITY_DATA_DIR
        value: /var/data/community
      # Recruiting fingerprints / players / visit intel — same disk across redeploys.
      - key: GV_RECRUITING_DATA_DIR
        value: /var/data/recruiting
      # Never accept published default admin PIN in production.
      - key: DISABLE_DEFAULT_ADMIN_PIN
        value: "true"
      - key: ALLOW_LEGACY_ADMIN_PIN
        value: "false"
      # FutureCast UF% trend history + Rivals PM fingerprints — survive redeploys for Lab movement.
      - key: GV_FUTURECAST_DATA_DIR
        value: /var/data/futurecast
      - key: GV_LAB_PROMOTIONS_PATH
        value: /var/data/recruiting/lab-promotions.json
      - key: GV_ADMIN_ALLOWLIST_PATH
        value: /var/data/recruiting/admin-allowlist.json
      - key: LAB_INTEL_PROMOTE
        value: "true"
      - key: EMAIL_PROVIDER
        value: emailjs
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: STRIPE_WEB_CHECKOUT_ENABLED
        value: "true"
      - key: MONITORING_CRON_SECRET
        sync: false
      - key: FILM_ROOM_DATA_DIR
        value: /var/data/film-room
      # Stripe web checkout (set in dashboard; leave unset until prices exist)
