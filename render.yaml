  - type: cron
    name: gatorvault-api-keepalive
    schedule: "*/2 * * * *"
    runtime: node
    region: oregon
    startCommand: node server/scripts/render-keepalive-ping.js
    envVars:
      - key: KEEPALIVE_URL
        value: https://gatorvault-api.onrender.com/health
      - key: KEEPALIVE_PING_URL
        value: https://gatorvault-api.onrender.com/api/ping
      # Soft Lab/hub warm — concurrency 1 avoids /ready stampede; keeps FutureCast + profiles hot.
      - key: API_STAY_GREEN
        value: "false"
      - key: KEEPALIVE_FULL_TOUCH
        value: "true"
      - key: KEEPALIVE_HUB_TOUCH
        value: "false"
      - key: KEEPALIVE_TOUCH_CONCURRENCY
        value: "1"

  # Beat ingest cron — hardened with API warm check, retries, soft failures (always exit 0).
  # Optional future: move to a dedicated worker service to isolate from API deploys.
  - type: cron
    name: gatorvault-api-beat-ingest
    schedule: "*/10 * * * *"
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node scripts/render-beat-ingest-cron.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
    name: gatorvault-api-recruiting-ingest
    schedule: "0 */2 * * *"
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node scripts/render-recruiting-ingest-cron.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: RIVALS_PM_INGEST_ENABLED
        value: "true"
      - key: MONITORING_CRON_SECRET
        sync: false

  # Light On3 path — API stay-green soft-skips heavy steps so this cron cannot 502-loop login.
  - type: cron
    name: gatorvault-api-recruiting-light
    schedule: "0 * * * *"
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node scripts/render-recruiting-light-cron.js
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://gatorvault-api.onrender.com
      - key: MONITORING_CRON_SECRET
        sync: false

  # Hub rebuild — Tier B warms priority memory after refresh (GETs never sync-rebuild).
  - type: cron
    name: gatorvault-api-hub-refresh
    schedule: "25 */2 * * *"
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node scripts/render-hub-refresh-cron.js
    envVars:
      - key: HUB_REFRESH_URL
        value: https://gatorvault-api.onrender.com/api/recruiting/hub/refresh?warmAfter=priority
      - key: MONITORING_CRON_SECRET
        sync: false

  # Tier B: spaced elite warm (lite now, then HP/bundle/master with gaps). No parallel lab-warm.
  - type: cron
    name: gatorvault-api-hub-warm
    schedule: "*/25 * * * *"
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node scripts/render-hub-warm-cron.js
    envVars:
      - key: HUB_WARM_URL
        value: https://gatorvault-api.onrender.com/api/recruiting/hub/warm-memory?mode=spaced&years=2028
      - key: LAB_WARM_URL
        value: ""
      - key: MONITORING_CRON_SECRET
        sync: false

  - type: cron
